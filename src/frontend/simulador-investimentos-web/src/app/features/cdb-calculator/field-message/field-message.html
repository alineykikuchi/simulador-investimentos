<p [id]="messageId()" class="message" [class.message--error]="error()">
  @if (error()) {
    <svg
      class="message__icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.2"
      stroke-linecap="round"
      aria-hidden="true"
      focusable="false"
    >
      <circle cx="12" cy="12" r="9" />
      <path d="M12 8v5" />
      <path d="M12 16.5v.5" />
    </svg>
    <span class="message__text">{{ error() }}</span>
  } @else {
    {{ hint() }}
  }
</p>
