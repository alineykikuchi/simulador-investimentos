<app-cdb-form
  [loading]="simulation.loading()"
  (simulate)="simulation.simulate($event)"
  (invalidSubmit)="simulation.reset()"
  (cleared)="simulation.reset()"
/>

<!-- A região live existe desde o carregamento: precisa estar no DOM antes de o conteúdo mudar. -->
<section
  #resultSection
  class="result"
  aria-live="polite"
  aria-labelledby="titulo-resultado"
  [attr.aria-busy]="simulation.loading() ? 'true' : null"
>
  @if (simulation.result(); as result) {
    <app-cdb-result [result]="result" />
  } @else {
    <app-cdb-result-placeholder
      [state]="placeholderState()"
      [message]="simulation.errorMessage()"
    />
  }
</section>
