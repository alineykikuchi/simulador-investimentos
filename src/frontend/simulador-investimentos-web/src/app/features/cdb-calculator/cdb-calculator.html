<section class="calculator">
  <h2>Simulação de CDB</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label for="initialAmount">Valor da aplicação (R$)</label>
    <input id="initialAmount" type="number" step="0.01" min="0.01" formControlName="initialAmount" />

    <label for="months">Prazo para resgate (meses)</label>
    <input id="months" type="number" step="1" min="2" formControlName="months" />

    <button type="submit" [disabled]="loading()">Calcular</button>
  </form>

  <!-- TODO: exibir o resultado bruto e líquido quando `result()` estiver preenchido
       e a mensagem de erro quando `errorMessage()` estiver preenchida. -->
</section>
